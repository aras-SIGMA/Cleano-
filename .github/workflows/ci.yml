name: CI

on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (sintaks + boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cleano-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cleano-backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Cek sintaks semua .js
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find . -name '*.js' -not -path './node_modules/*')
          exit $fail

      - name: Boot server tanpa database
        run: |
          cp .env.example .env
          node server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3000/api/health)
          cat /tmp/health.json
          # tanpa kredensial DB, health harus 503 — bukan crash, bukan 200
          test "$code" = "503"

      - name: Cek 404 handler
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/tidak-ada)
          test "$code" = "404"

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cleano_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan .env dari contoh
        run: cp .env.example .env

      - name: Dependensi
        run: flutter pub get

      - name: Analyze
        run: dart analyze lib

      - name: Test
        run: flutter test

      - name: Pastikan build web lolos
        run: flutter build web --release