name: cleano_app
description: "Cleano — Smart Laundry POS & Order Tracking (Portal Kasir & Pelanggan)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # networking & session
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  flutter_dotenv: ^6.0.0

  # presentasi & format
  intl: ^0.20.3
  fl_chart: ^1.3.1
  qr_flutter: ^4.1.0

  # kamera & pemindaian
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0

  # pembayaran & ekspor laporan
  webview_flutter: ^4.14.1
  pdf: ^3.13.1
  printing: ^5.15.1
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env